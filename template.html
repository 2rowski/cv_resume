<title>Michał Tworowski CV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: identity band → profile + figures → career timeline (scheduler-style lanes) → experience | sidebar.
   Print/PDF collapses everything into one plain A4 column without charts. */
:root {
  --bg: #F3F5F6;
  --surface: #FFFFFF;
  --ink: #14202A;
  --ink-2: #3D4B57;
  --muted: #5A6773;
  --line: #DAE0E4;
  --accent: #0D6E89;
  --accent-ink: #FFFFFF;
  --accent-tint: #E1EEF2;
  --past: #7A8A96;
  --track: #D0E3E9;

  --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --step--2: 0.8125rem;
  --step--1: 0.9375rem;
  --step-0: 1.0625rem;
  --step-1: 1.1875rem;
  --step-2: 1.4375rem;
  --step-mono: 0.875rem;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1418;
    --surface: #151D23;
    --ink: #E3E9ED;
    --ink-2: #B7C2CA;
    --muted: #8D9AA5;
    --line: #26323B;
    --accent: #5DB9D4;
    --accent-ink: #0A1A20;
    --accent-tint: #173039;
    --past: #64737F;
    --track: #213C46;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1418;
  --surface: #151D23;
  --ink: #E3E9ED;
  --ink-2: #B7C2CA;
  --muted: #8D9AA5;
  --line: #26323B;
  --accent: #5DB9D4;
  --accent-ink: #0A1A20;
  --accent-tint: #173039;
  --past: #64737F;
  --track: #213C46;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--step-0);
  line-height: 1.55;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.wrap {
  max-width: 1100px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Identity band ---------- */
.hero { background: var(--surface); border-bottom: 1px solid var(--line); }
.hero-inner {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 20px 28px;
  align-items: center;
  padding-block: 32px 28px;
}
.photo {
  display: block;
  width: 120px;
  height: 120px;
  border-radius: 16px;
  object-fit: cover;
  background: var(--line);
}
h1 {
  margin: 0;
  font-size: clamp(2rem, 1.4rem + 2.2vw, 2.75rem);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.headline { margin: 6px 0 0; font-size: var(--step-1); font-weight: 500; color: var(--accent); }
.contact {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 20px;
  font-size: var(--step--1);
  color: var(--ink-2);
}
.contact li { display: inline-flex; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.contact .k { font-family: var(--font-mono); font-size: var(--step--2); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; align-self: start; }
.ctl-row { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg);
  color: var(--ink-2);
  cursor: pointer;
}
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }
.icon-btn svg { width: 18px; height: 18px; }
.ic-sun { display: none; }
:root[data-theme="dark"] .ic-sun { display: block; }
:root[data-theme="dark"] .ic-moon { display: none; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--bg); }
.lang button {
  font: 500 var(--step-mono)/1 var(--font-mono);
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 8px 13px;
  border-radius: 999px;
  cursor: pointer;
}
.lang button:hover { color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: var(--step--1);
  font-weight: 500;
  padding: 8px 15px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  color: var(--accent);
  text-decoration: none;
}
.btn:hover { background: var(--accent-tint); }
.btn svg { width: 14px; height: 14px; }
.copy {
  font: 500 var(--step--2)/1 var(--font-mono);
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  padding: 4px 8px;
  cursor: pointer;
}
.copy:hover { color: var(--ink); border-color: var(--muted); }

/* ---------- Page body ---------- */
main.wrap { display: grid; gap: 44px; padding-block: 36px 12px; }
h2 {
  margin: 0 0 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  font: 500 var(--step-mono)/1.2 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.summary-sec p { margin: 0; max-width: 72ch; font-size: var(--step-1); line-height: 1.65; color: var(--ink-2); }

/* ---------- Selected results ---------- */
.kpis { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.kpi {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  padding: 20px 22px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.kpi-feature { gap: 20px; background: var(--accent-tint); border-color: transparent; }
.kpi-eyebrow { font: 500 var(--step--2)/1.3 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.kpi-val { font-size: 2.5rem; line-height: 1; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
.kpi-lbl { margin-top: 6px; font-size: var(--step--1); line-height: 1.35; color: var(--ink-2); }
/* Key report as a data flow: stage → stage → stage */
.flow { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr) 28px minmax(0, 1fr); align-items: stretch; }
.node { display: grid; align-content: start; gap: 4px; min-width: 0; padding: 14px 14px 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.node.hl { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.node-k { font: 500 var(--step--2)/1.3 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.node .kpi-val { margin-top: 4px; font-size: 2rem; }
.node.hl .kpi-val { color: var(--accent); }
.node .kpi-lbl { margin-top: 2px; }
.arr { display: grid; place-items: center; color: var(--accent); }
.arr svg { width: 18px; height: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
.chip { padding: 4px 9px; border: 1px solid var(--line); border-radius: 12px; font: 500 var(--step--2)/1.3 var(--font-mono); color: var(--ink-2); }

/* ---------- Career timeline ---------- */
.tl-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 24px 14px; }
.tl-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 20px; margin-bottom: 6px; }
.tl-note { margin: 0; font-size: var(--step--1); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: var(--step--1); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { display: inline-block; width: 16px; height: 8px; border-radius: 2px; background: var(--past); }
.sw.current { background: var(--accent); }

.tl-plot { position: relative; padding-top: 22px; padding-bottom: 30px; }
.tl-group {
  margin: 12px 0 2px;
  font: 500 var(--step--2)/1.3 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.tl-group:first-of-type { margin-top: 0; }
.lane { display: block; padding: 7px 8px 8px; margin-inline: -8px; border-radius: 8px; color: inherit; text-decoration: none; }
.lane:hover { background: var(--accent-tint); }
.lane-label { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; font-size: var(--step--1); }
.lane-title { font-weight: 500; color: var(--ink); }
.lane-dates { font: 400 var(--step-mono) var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.track { position: relative; display: block; height: 10px; margin-top: 6px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.bar { position: absolute; top: 0; bottom: 0; min-width: 6px; border-radius: 3px; background: var(--past); }
.bar.current { background: var(--accent); }
.axis { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; border-top: 1px solid var(--line); }
.tick {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  padding-top: 7px;
  font: 400 var(--step--2)/1 var(--font-mono);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tick::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 4px; background: var(--line); }
.now { position: absolute; top: 18px; bottom: 24px; width: 0; border-left: 1px solid var(--accent); }
.now span {
  position: absolute;
  top: -18px;
  right: 5px;
  font: 500 var(--step--2)/1 var(--font-mono);
  color: var(--accent);
  white-space: nowrap;
}

/* ---------- Experience + sidebar ---------- */
.cols { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 44px 52px; align-items: start; }
.side { display: grid; gap: 34px; }

.job { display: grid; gap: 16px; padding-bottom: 28px; scroll-margin-top: 16px; }
.job + .job { padding-top: 26px; border-top: 1px solid var(--line); }
.job h3 { margin: 0; font-size: var(--step-2); line-height: 1.25; font-weight: 600; }
.team { margin: 3px 0 0; font-size: var(--step--1); color: var(--muted); }
.positions { display: grid; gap: 22px; }
.positions.compact { gap: 8px; }
.pos { display: grid; gap: 8px; }
.pos-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 16px; }
.pos h4 { margin: 0; font-size: var(--step-1); font-weight: 600; line-height: 1.35; }
.pos h4.current::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 9px;
  border-radius: 50%;
  background: var(--accent);
  vertical-align: 2px;
}
.dates { font: 400 var(--step-mono) var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
h5 {
  margin: 6px 0 2px;
  font: 500 var(--step--2)/1.3 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.bul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
/* Markers are grid items, not positioned boxes: positioned list items would be painted
   after the rest of the page and scramble the PDF's text order for ATS parsers. */
.bul li { display: grid; grid-template-columns: 20px minmax(0, 1fr); color: var(--ink-2); }
.bul li::before { content: ""; justify-self: start; margin: 0.72em 0 0 3px; width: 7px; height: 1.5px; background: var(--muted); }
.bul.ach li { color: var(--ink); }
.bul.ach li::before { margin-top: 0.5em; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }

.skill-group + .skill-group { margin-top: 18px; }
.skill-group h3 { margin: 0 0 8px; font-size: var(--step-0); font-weight: 600; }
.skill-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.skill-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto 6.5rem; align-items: center; gap: 12px; font-size: var(--step--1); }
.sk-name { min-width: 0; color: var(--ink); }
.meter { display: inline-flex; gap: 2px; }
.meter i { display: block; width: 16px; height: 6px; border-radius: 2px; background: var(--track); }
.meter i.on { background: var(--accent); }
.sk-lvl { font: 400 var(--step-mono) var(--font-mono); color: var(--muted); }

.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: var(--step--1); color: var(--ink-2); }
.plain .t { display: block; font-size: var(--step-0); font-weight: 600; color: var(--ink); }
.plain .m { font: 400 var(--step-mono) var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.inline-kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.interests { margin: 0; font-size: var(--step--1); color: var(--ink-2); }

.gdpr { margin: 0; font-size: 0.6875rem; line-height: 1.4; color: var(--muted); }
.foot { padding-block: 22px 40px; font-size: var(--step--1); color: var(--muted); }
.foot-inner { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-feature { grid-column: 1 / -1; }
}
@media (max-width: 680px) {
  .hero-inner { grid-template-columns: auto minmax(0, 1fr); padding-block: 18px 22px; gap: 16px 18px; }
  .controls { grid-column: 1 / -1; grid-row: 1; flex-direction: row; justify-content: space-between; align-items: center; }
  .photo { width: 84px; height: 84px; border-radius: 12px; }
  .tl-card { padding: 16px 18px 12px; }
  .tick.minor { display: none; }
  main.wrap { gap: 36px; padding-block: 28px 8px; }
  .kpi { padding: 16px 16px; }
  .kpi-val { font-size: 1.875rem; }
  .flow { grid-template-columns: minmax(0, 1fr); }
  .arr { height: 26px; }
  .arr svg { transform: rotate(90deg); }
}

@media (prefers-reduced-motion: no-preference) {
  .lane, .btn, .lang button { transition: background-color 0.15s ease, color 0.15s ease; }
}

/* ---------- Print / PDF: one plain A4 column ---------- */
@page { size: A4; margin: 13mm 14mm 13mm; }
@media print {
  /* triple :root beats the dark-mode selectors, so paper is always light */
  :root:root:root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --ink: #111B23;
    --ink-2: #2C3943;
    --muted: #4E5A65;
    --line: #D3DADF;
    --accent: #0D6E89;
    color-scheme: light;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-size: 9.3pt; line-height: 1.38; background: #FFFFFF; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: none; padding: 0; }
  .controls, .copy, .figs-sec, .tl-sec, .foot, .meter { display: none !important; }

  .hero { background: none; border-bottom: 1px solid var(--line); }
  .hero-inner { grid-template-columns: auto minmax(0, 1fr); gap: 0 14pt; padding-block: 0 9pt; }
  .photo { width: 23mm; height: 23mm; border-radius: 3mm; }
  h1 { font-size: 20pt; }
  .headline { font-size: 10.5pt; margin-top: 2pt; }
  .contact { margin-top: 6pt; gap: 2pt 14pt; font-size: 8.6pt; }

  main.wrap { display: block; padding: 0; }
  main.wrap > * + * { margin-top: 11pt; }
  .summary-sec { margin-top: 10pt; }
  .summary-sec p { font-size: 9.3pt; line-height: 1.45; max-width: none; }
  h2 { font-size: 7.6pt; margin: 0 0 6pt; padding-bottom: 3pt; }

  .cols { display: block; }
  .side { display: block; }
  .side > section { margin-top: 11pt; }
  .job { gap: 6pt; padding-bottom: 8pt; }
  .job + .job { padding-top: 8pt; }
  .job h3 { font-size: 11pt; }
  .team { font-size: 8.4pt; }
  .positions { gap: 8pt; }
  .positions.compact { gap: 1pt; }
  .pos { gap: 3pt; }
  .pos h4 { font-size: 9.8pt; }
  .dates { font-size: 8.2pt; }
  h5 { font-size: 6.8pt; margin: 2pt 0 0; }
  .bul { gap: 1.5pt; }
  .bul li { grid-template-columns: 12pt minmax(0, 1fr); }
  .bul li::before { margin-left: 1pt; }
  .inline-kv { display: block; }

  .skill-group + .skill-group { margin-top: 2pt; }
  .skill-group h3 { display: inline; font-size: 9.3pt; }
  .skill-group h3::after { content: ": "; }
  .skill-list, .skill-list li { display: inline; }
  .skill-list li:not(:last-child)::after { content: ", "; }
  .sk-lvl { font: inherit; color: var(--muted); }
  .sk-lvl::before { content: " ("; }
  .sk-lvl::after { content: ")"; }

  .plain { gap: 4pt; font-size: 9pt; }
  .plain .t { display: inline; font-size: 9.3pt; }
  .plain .t::after { content: " · "; font-weight: 400; color: var(--muted); }
  .gdpr { margin-top: 14pt; font-size: 7pt; }

  .pos-head, h2, h3, h4, h5 { break-after: avoid; }
  .bul li, .plain li, .skill-group { break-inside: avoid; }
}
</style>
<!--BODY-->
<header class="hero">
  <div class="wrap hero-inner">
    <img class="photo" id="photo" alt="" width="120" height="120">
    <div class="identity">
      <h1 id="name"></h1>
      <p class="headline" id="headline"></p>
      <ul class="contact" id="contact"></ul>
    </div>
    <div class="controls">
      <div class="ctl-row">
        <div class="lang" role="group" id="lang-group">
          <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" id="lang-pl" data-lang="pl" aria-pressed="false">PL</button>
        </div>
        <button type="button" class="icon-btn" id="theme-btn" aria-pressed="false">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        </button>
      </div>
      <a class="btn" id="pdf-link" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8m0 0L5 7m3 3l3-3M3 13h10"/></svg>
        <span id="pdf-label"></span>
      </a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="summary-sec" id="summary-sec">
    <h2 data-i18n="profile"></h2>
    <p id="summary"></p>
  </section>

  <section class="figs-sec">
    <h2 data-i18n="figures"></h2>
    <div class="kpis" id="figs"></div>
  </section>

  <section class="tl-sec" aria-labelledby="tl-h">
    <h2 id="tl-h" data-i18n="timeline"></h2>
    <div class="tl-card">
      <div class="tl-top">
        <p class="tl-note" data-i18n="timelineNote"></p>
        <div class="legend">
          <span><i class="sw current"></i><span data-i18n="legendCurrent"></span></span>
          <span><i class="sw"></i><span data-i18n="legendPast"></span></span>
        </div>
      </div>
      <div class="tl-plot" id="timeline"></div>
    </div>
  </section>

  <div class="cols">
    <section class="experience" aria-labelledby="exp-h">
      <h2 id="exp-h" data-i18n="experience"></h2>
      <div id="experience"></div>
    </section>
    <aside class="side">
      <section><h2 data-i18n="skills"></h2><div id="skills"></div></section>
      <section><h2 data-i18n="languages"></h2><ul class="plain" id="languages"></ul></section>
      <section><h2 data-i18n="education"></h2><ul class="plain" id="education"></ul></section>
      <section><h2 data-i18n="courses"></h2><ul class="plain" id="courses"></ul></section>
      <section><h2 data-i18n="interests"></h2><p class="interests" id="interests"></p></section>
    </aside>
  </div>

  <p class="gdpr" id="gdpr" hidden></p>
</main>

<footer class="wrap foot"><div class="foot-inner" id="foot"></div></footer>

<script id="cv-data" type="application/json">__CV_JSON__</script>
<script>
(() => {
  'use strict';
  const payload = JSON.parse(document.getElementById('cv-data').textContent);
  const cv = payload.cv;
  const build = payload.build || {};
  const isPrint = build.mode === 'print';

  const UI = {
    en: {
      profile: 'Profile', figures: 'Selected results', timeline: 'Career timeline',
      timelineNote: 'One bar per role. Select a role to jump to its details.',
      legendCurrent: 'Current role', legendPast: 'Previous role', today: 'today',
      experience: 'Experience', responsibilities: 'Responsibilities', achievements: 'Achievements',
      skills: 'Skills', languages: 'Languages', education: 'Education', courses: 'Courses',
      interests: 'Interests', present: 'present', download: 'Download PDF', copy: 'Copy',
      copied: 'Copied', updated: 'Last updated', source: 'Built from cv.yaml', langGroup: 'Language',
      email: 'Email', phone: 'Phone', location: 'Based in',
      themeDark: 'Switch to dark theme', themeLight: 'Switch to light theme'
    },
    pl: {
      profile: 'Profil', figures: 'Wybrane wyniki', timeline: 'Przebieg kariery',
      timelineNote: 'Jeden pasek to jedno stanowisko. Wybierz je, aby przejść do szczegółów.',
      legendCurrent: 'Obecne stanowisko', legendPast: 'Poprzednie stanowisko', today: 'dziś',
      experience: 'Doświadczenie', responsibilities: 'Obowiązki', achievements: 'Osiągnięcia',
      skills: 'Umiejętności', languages: 'Języki', education: 'Wykształcenie', courses: 'Kursy',
      interests: 'Zainteresowania', present: 'obecnie', download: 'Pobierz PDF', copy: 'Kopiuj',
      copied: 'Skopiowano', updated: 'Ostatnia aktualizacja', source: 'Generowane z cv.yaml', langGroup: 'Język',
      email: 'E-mail', phone: 'Telefon', location: 'Lokalizacja',
      themeDark: 'Włącz ciemny motyw', themeLight: 'Włącz jasny motyw'
    }
  };
  const MONTHS_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const LEVELS = ['junior', 'mid', 'mid/senior', 'senior'];

  const storage = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  };
  const isLang = (v) => v === 'en' || v === 'pl';

  function pickLang() {
    if (isLang(build.lang)) return build.lang;
    let q = null;
    try { q = new URLSearchParams(location.search).get('lang'); } catch (e) { /* ignore */ }
    if (isLang(q)) return q;
    const hsh = location.hash.replace('#', '');
    if (isLang(hsh)) return hsh;
    const saved = storage.get('cv-lang');
    if (isLang(saved)) return saved;
    return (navigator.language || '').toLowerCase().startsWith('pl') ? 'pl' : 'en';
  }

  let lang = pickLang();
  const ui = () => UI[lang];
  const tr = (v) => {
    if (v == null) return '';
    if (typeof v === 'object' && !Array.isArray(v)) return v[lang] ?? v.en ?? '';
    return String(v);
  };
  const $ = (id) => document.getElementById(id);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'style') e.style.cssText = v;
        else e.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false || kid === '') continue;
      e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return e;
  }

  /* ---------- dates ---------- */
  const NOW = new Date();
  const NOW_IDX = NOW.getFullYear() * 12 + NOW.getMonth();
  const monthIdx = (s) => {
    const [y, m] = String(s).split('-').map(Number);
    return y * 12 + ((m || 1) - 1);
  };
  const isPresent = (p) => p.end === 'present' || p.end == null;
  function fmtDate(s) {
    if (s === 'present') return ui().present;
    const [y, m] = String(s).split('-');
    if (!m) return y;
    return lang === 'pl' ? `${m}.${y}` : `${MONTHS_EN[Number(m) - 1]} ${y}`;
  }
  // Past roles count both the first and the last month; current roles count elapsed months.
  const durationMonths = (p) => isPresent(p) ? NOW_IDX - monthIdx(p.start) : monthIdx(p.end) - monthIdx(p.start) + 1;
  // Polish plural forms: 1 rok / 2–4 lata / 5+ lat (12–14 take the "many" form)
  function plural(n, one, few, many) {
    if (n === 1) return one;
    const d = n % 10, t = n % 100;
    return d >= 2 && d <= 4 && (t < 12 || t > 14) ? few : many;
  }
  function fmtDuration(n) {
    const y = Math.floor(n / 12);
    const m = y ? n % 12 : Math.max(n % 12, 1);
    const parts = [];
    if (lang === 'pl') {
      if (y) parts.push(`${y} ${plural(y, 'rok', 'lata', 'lat')}`);
      if (m) parts.push(`${m} ${plural(m, 'miesiąc', 'miesiące', 'miesięcy')}`);
    } else {
      if (y) parts.push(`${y} ${y === 1 ? 'year' : 'years'}`);
      if (m) parts.push(`${m} ${m === 1 ? 'month' : 'months'}`);
    }
    return parts.join(' ');
  }
  const range = (p) => `${fmtDate(p.start)} – ${fmtDate(isPresent(p) ? 'present' : p.end)}`;
  function fmtGenerated(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return lang === 'pl' ? `${d}.${m}.${y}` : `${Number(d)} ${MONTHS_EN[Number(m) - 1]} ${y}`;
  }

  /* ---------- sections ---------- */
  function renderHeader() {
    const b = cv.basics;
    const photo = $('photo');
    if (b.photo) { photo.src = b.photo; photo.alt = b.name; } else { photo.hidden = true; }
    $('name').textContent = b.name;
    $('headline').textContent = tr(b.headline);

    const items = [];
    if (b.location) items.push(h('li', null, tr(b.location)));
    // The address ships reversed and base64-encoded, so scrapers reading the raw HTML don't find it.
    let email = '';
    try { email = build.email ? atob(build.email).split('').reverse().join('') : ''; } catch (e) { email = ''; }
    if (email) {
      const copyBtn = isPrint ? null : h('button', { type: 'button', class: 'copy' }, ui().copy);
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          const done = () => { copyBtn.textContent = ui().copied; setTimeout(() => { copyBtn.textContent = ui().copy; }, 1600); };
          const fallback = () => {
            const sel = window.getSelection();
            const rng = document.createRange();
            rng.selectNodeContents(copyBtn.previousSibling);
            sel.removeAllRanges();
            sel.addRange(rng);
          };
          try {
            navigator.clipboard.writeText(email).then(done, fallback);
          } catch (e) { fallback(); }
        });
      }
      items.push(h('li', null, h('a', { href: `mailto:${email}` }, email), copyBtn));
    }
    if (build.phone) items.push(h('li', null, h('span', { class: 'k' }, ui().phone), build.phone));
    const link = (url, label) => {
      const shown = String(url).replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
      return h('li', null, h('span', { class: 'k' }, label), h('a', { href: url, target: '_blank', rel: 'noopener' }, shown));
    };
    if (b.linkedin) items.push(link(b.linkedin, 'LinkedIn'));
    if (b.github) items.push(link(b.github, 'GitHub'));
    $('contact').replaceChildren(...items);

    const pdf = build.pdf && build.pdf[lang];
    const pdfLink = $('pdf-link');
    pdfLink.hidden = !pdf || isPrint;
    if (pdf) pdfLink.href = pdf;
    $('pdf-label').textContent = ui().download;
  }

  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
  function renderFeature(f) {
    const nodes = [];
    (f.stages || []).forEach((s, i) => {
      if (i > 0) {
        const arrow = h('div', { class: 'arr', 'aria-hidden': 'true' });
        arrow.innerHTML = ARROW;
        nodes.push(arrow);
      }
      nodes.push(h('div', { class: s.highlight ? 'node hl' : 'node' },
        h('div', { class: 'node-k' }, tr(s.stage)),
        h('div', { class: 'kpi-val' }, s.value),
        h('div', { class: 'kpi-lbl' }, tr(s.label))
      ));
    });
    return h('div', { class: 'kpi kpi-feature' },
      h('div', { class: 'kpi-eyebrow' }, tr(f.title)),
      h('div', { class: 'flow' }, nodes)
    );
  }

  function renderIntro() {
    const summary = tr(cv.basics.summary);
    $('summary').textContent = summary;
    $('summary-sec').hidden = !summary;

    const hl = cv.highlights || {};
    const cards = [];
    if (hl.feature) cards.push(renderFeature(hl.feature));
    (hl.tiles || []).forEach((t) => cards.push(
      h('div', { class: 'kpi' },
        h('div', { class: 'kpi-val' }, t.value),
        h('div', { class: 'kpi-lbl' }, tr(t.label)),
        t.tags ? h('div', { class: 'chips' }, t.tags.map((x) => h('span', { class: 'chip' }, tr(x)))) : null
      )
    ));
    if (hl.experience) {
      // Years since the earliest role in the work history, counted on the day the page is opened
      const first = Math.min(...cv.work.flatMap((w) => w.positions).map((p) => monthIdx(p.start)));
      const years = Math.floor((NOW_IDX - first) / 12);
      cards.push(h('div', { class: 'kpi' },
        h('div', { class: 'kpi-val' }, `${years}+`),
        h('div', { class: 'kpi-lbl' }, tr(hl.experience.label)),
        hl.experience.tags ? h('div', { class: 'chips' }, hl.experience.tags.map((x) => h('span', { class: 'chip' }, tr(x)))) : null
      ));
    }
    $('figs').replaceChildren(...cards);
  }

  function renderTimeline() {
    const plot = $('timeline');
    const all = cv.work.flatMap((w) => w.positions);
    const firstYear = Math.min(...all.map((p) => Math.floor(monthIdx(p.start) / 12)));
    const lastYear = NOW.getFullYear() + 1;
    const min = firstYear * 12;
    const max = lastYear * 12;
    const pct = (v) => `${(((v - min) / (max - min)) * 100).toFixed(3)}%`;
    const nowPos = NOW_IDX + (NOW.getDate() - 1) / 31;

    const kids = [];
    cv.work.forEach((w, wi) => {
      kids.push(h('div', { class: 'tl-group' }, w.company));
      w.positions.forEach((p) => {
        const current = isPresent(p);
        const start = monthIdx(p.start);
        const end = current ? nowPos : monthIdx(p.end) + 1;
        kids.push(h('a', { class: 'lane', href: `#exp-${wi}` },
          h('span', { class: 'lane-label' },
            h('span', { class: 'lane-title' }, tr(p.title)),
            h('span', { class: 'lane-dates' }, `${range(p)} · ${fmtDuration(durationMonths(p))}`)
          ),
          h('span', { class: 'track', 'aria-hidden': 'true' },
            h('span', { class: current ? 'bar current' : 'bar', style: `left:${pct(start)};width:${pct(min + (end - start))}` })
          )
        ));
      });
    });

    const axis = h('div', { class: 'axis', 'aria-hidden': 'true' });
    for (let y = firstYear; y <= lastYear; y++) {
      axis.append(h('span', { class: (y - firstYear) % 2 ? 'tick minor' : 'tick', style: `left:${pct(y * 12)}` }, y));
    }
    const now = h('div', { class: 'now', style: `left:${pct(nowPos)}`, 'aria-hidden': 'true' }, h('span', null, ui().today));
    plot.replaceChildren(...kids, now, axis);
  }

  function bullets(o) {
    const out = [];
    if (o.responsibilities && o.responsibilities.length) {
      out.push(h('h5', null, ui().responsibilities), h('ul', { class: 'bul' }, o.responsibilities.map((r) => h('li', null, tr(r)))));
    }
    if (o.achievements && o.achievements.length) {
      out.push(h('h5', null, ui().achievements), h('ul', { class: 'bul ach' }, o.achievements.map((r) => h('li', null, tr(r)))));
    }
    return out.length ? h('div', { class: 'pos' }, out) : null;
  }

  function renderExperience() {
    $('experience').replaceChildren(...cv.work.map((w, wi) => {
      const hasPositionBullets = w.positions.some((p) => (p.responsibilities || []).length || (p.achievements || []).length);
      const positions = h('div', { class: hasPositionBullets ? 'positions' : 'positions compact' },
        w.positions.map((p) => h('div', { class: 'pos' },
          h('div', { class: 'pos-head' },
            h('h4', { class: isPresent(p) ? 'current' : null }, tr(p.title)),
            h('span', { class: 'dates' }, `${range(p)} · ${fmtDuration(durationMonths(p))}`)
          ),
          bullets(p)
        ))
      );
      return h('article', { class: 'job', id: `exp-${wi}` },
        h('header', null, h('h3', null, w.company), w.team ? h('p', { class: 'team' }, tr(w.team)) : null),
        positions,
        bullets(w)
      );
    }));
  }

  function renderSide() {
    $('skills').replaceChildren(...(cv.skills || []).map((g) =>
      h('div', { class: 'skill-group' },
        h('h3', null, tr(g.category)),
        h('ul', { class: 'skill-list' }, g.items.map((it) => {
          const lvl = LEVELS.indexOf(it.level) + 1;
          return h('li', null,
            h('span', { class: 'sk-name' }, it.name),
            h('span', { class: 'meter', 'aria-hidden': 'true' }, [1, 2, 3, 4].map((i) => h('i', { class: i <= lvl ? 'on' : null }))),
            h('span', { class: 'sk-lvl' }, it.level)
          );
        }))
      )
    ));

    $('languages').replaceChildren(...(cv.languages || []).map((l) =>
      h('li', { class: 'inline-kv' }, h('span', { class: 't' }, tr(l.name)), h('span', { class: 'm' }, tr(l.level)))
    ));

    $('education').replaceChildren(...(cv.education || []).map((e) => {
      const years = e.start ? `${e.start}–${e.end}` : `${e.end}`;
      return h('li', null,
        h('span', { class: 't' }, tr(e.area)),
        h('span', null, [tr(e.degree), tr(e.institution)].filter(Boolean).join(', ')),
        ' ', h('span', { class: 'm' }, `· ${years}`)
      );
    }));

    $('courses').replaceChildren(...(cv.courses || []).map((c) =>
      h('li', null, h('span', { class: 't' }, c.name), h('span', null, c.provider || tr(c.description)))
    ));

    const interests = cv.interests ? (cv.interests[lang] || cv.interests.en || []) : [];
    $('interests').textContent = interests.join(' · ');
  }

  function renderFooter() {
    const parts = [h('span', null, `${ui().updated}: ${fmtGenerated(build.generated)}`)];
    if (build.repo) parts.push(h('a', { href: build.repo, target: '_blank', rel: 'noopener' }, ui().source));
    $('foot').replaceChildren(...parts);

    const gdpr = $('gdpr');
    gdpr.hidden = !build.gdpr;
    if (build.gdpr) gdpr.textContent = tr(cv.gdpr_clause);
  }

  /* ---------- theme: dark by default, light on request; print is always light ---------- */
  const isTheme = (v) => v === 'light' || v === 'dark';
  function pickTheme() {
    if (isPrint) return 'light';
    let q = null;
    try { q = new URLSearchParams(location.search).get('theme'); } catch (e) { /* ignore */ }
    if (isTheme(q)) return q;
    const saved = storage.get('cv-theme');
    return isTheme(saved) ? saved : 'dark';
  }
  let theme = pickTheme();
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    const btn = $('theme-btn');
    btn.setAttribute('aria-pressed', String(theme === 'dark'));
    const label = theme === 'dark' ? ui().themeLight : ui().themeDark;
    btn.setAttribute('aria-label', label);
    btn.title = label;
  }
  $('theme-btn').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    storage.set('cv-theme', theme);
    applyTheme();
  });

  function render() {
    document.documentElement.lang = lang;
    applyTheme();
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = ui()[el.dataset.i18n] || ''; });
    $('lang-group').setAttribute('aria-label', ui().langGroup);
    ['en', 'pl'].forEach((l) => $(`lang-${l}`).setAttribute('aria-pressed', String(l === lang)));
    renderHeader();
    renderIntro();
    renderTimeline();
    renderExperience();
    renderSide();
    renderFooter();
  }

  document.querySelectorAll('.lang button').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.lang === lang) return;
      lang = btn.dataset.lang;
      storage.set('cv-lang', lang);
      render();
    });
  });

  render();
})();
</script>
