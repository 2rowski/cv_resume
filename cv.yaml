        start: 2021-12
        end: present
        responsibilities:
          - en: Creating reports and data visualizations for internal clients
            pl: Tworzenie raportów i wizualizacji dla klientów wewnętrznych
          - en: Developing tools to improve Data Quality teams' efficiency (e.g. day-to-day data comparators, monitoring data volume changes)
            pl: Opracowywanie narzędzi usprawniających pracę zespołów Data Quality (np. porównywarki danych dzień do dnia, monitorowanie zmian wolumenów)
          - en: Building administrative tools (scheduler load overview, disk space monitoring, estimation of reload times for end-user applications)
            pl: Tworzenie narzędzi administracyjnych (podgląd obciążenia schedulerów, monitorowanie przestrzeni dyskowej, szacowanie czasu przeładowań aplikacji końcowych)
          - en: Diagnosing and fixing issues (including bugs after code changes, performance bottlenecks, RAM problems)
            pl: Diagnozowanie i usuwanie błędów (m.in. błędy wynikające ze zmian w kodzie, wąskie gardła, problemy z pamięcią RAM)
          - en: Designing and developing data models
            pl: Budowa i rozwój modeli danych
          - en: Optimizing report code to improve performance and reduce loading time
            pl: Optymalizacja kodu w raportach w celu poprawy wydajności i skrócenia czasu ładowania
          - en: Configuring alerts using the Alerting and NPrinting modules
            pl: Konfiguracja alertów z wykorzystaniem modułów Alerting i NPrinting
          - en: Preparing business analyses
            pl: Przygotowywanie analiz biznesowych
          - en: Maintaining and administering reporting applications
            pl: Utrzymanie i administracja istniejących aplikacji raportowych
          - en: End-user support (helpdesk) and communication with report users
            pl: Wsparcie użytkowników końcowych (helpdesk) i kontakt z odbiorcami raportów
          - en: Creating project documentation and user manuals
            pl: Tworzenie dokumentacji projektowej i instrukcji użytkownika
        achievements:
          - en: Implemented and maintained over 50 reports in SCM, Procurement, Commercial and Data Analysis areas
            pl: Wdrożenie i utrzymanie ponad 50 raportów w obszarach SCM, Zakupy, Commercial, Analiza Danych
          - en: Stabilized the ETL process for a key report (over 400M records, 150+ daily users, >10 GB of data); the report is ready before 9:00 AM every day
            pl: Ustabilizowanie procesu ETL dla kluczowego raportu (ponad 400 mln rekordów, >150 użytkowników dziennie, >10 GB danych); raport gotowy codziennie do godziny 9:00
          - en: Recommended migrating from the Alerting module to an NPrinting-based alerting solution, resulting in cost savings
            pl: Rekomendacja migracji z modułu Alerting na rozwiązanie alertowania oparte o NPrinting, co przyniosło oszczędności

