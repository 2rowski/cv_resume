          - en: Creating and automating processes, e.g. copying data between the PRD and TST landing zones
            pl: Tworzenie i automatyzacja procesów, m.in. kopiowanie danych pomiędzy landing zone środowisk PRD i TST
          - en: Working in the Azure DevOps environment
            pl: Praca w środowisku Azure DevOps
          - en: Creating technical documentation and standard operating procedures (SOPs)
            pl: Tworzenie dokumentacji technicznej oraz procedur SOP
